<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="เพื่อน Auto Battler: เกมจัดทีมแนว TFT ธีมเพื่อน เล่นคนเดียวกับบอตหรือออนไลน์กับเพื่อน"><style>html,body{margin:0;padding:0;background:#0b0d22;}[hidden]{display:none!important}</style></head><body>
<title>เพื่อน Auto Battler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>/* Layout: fixed 1280x720 game stage scaled to fit; tilted hex rooftop in the middle, synergies left, houses right, bench + shop along the bottom.
   One deliberate look (night rooftop in Bangkok), single theme by choice. */
:root {
  color-scheme: dark;
  --sky: #1a1d3b;          /* night sky over the rooftop */
  --sky-deep: #10122a;
  --tile: #2f8f8a;         /* rooftop tiles, teal-green from the concept art */
  --tile-edge: #1f6763;
  --bulb: #ffc857;         /* string-light amber: the accent */
  --neon: #ff5c8a;         /* street-food neon sign, used for danger/enemy */
  --panel: rgba(16, 18, 42, .86);
  --panel-line: rgba(255, 200, 87, .28);
  --ink: #f4efe4;
  --ink-dim: #a9adc8;
  --good: #5fd38d;
  --c1: #9aa4b8; --c2: #3fbf6b; --c3: #3aa0ff; --c4: #b25cff; --c5: #ffb830;
  --font-display: "Mitr", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-num: "Pixelify Sans", "Mitr", system-ui, sans-serif;   /* pixel numerals: gold, stage, cost, counts */
  --notch: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
  --lantern: #ff7a3d;      /* red-orange paper lanterns at the food stall */
  --cyan: #46d9ff;         /* neon diamond sign on the right */
}
html, body { height: 100%; }
body { margin: 0; background: var(--sky-deep); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
button { font-family: var(--font-display); color: var(--ink); cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--bulb); outline-offset: 2px; }

#viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
#stage { touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center center; flex: none;
  background:
    radial-gradient(1200px 500px at 50% 115%, rgba(255, 200, 87, .10), transparent 60%),
    linear-gradient(180deg, var(--sky-deep) 0%, var(--sky) 55%, #26284a 100%);
  overflow: hidden; user-select: none; -webkit-user-select: none; }
#skyline { position: absolute; left: 0; right: 0; top: 0; height: 180px; pointer-events: none; opacity: .9; }
#lights { position: absolute; inset: 0; pointer-events: none; }

/* ---------- top HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: grid; grid-template-columns: 230px 1fr 230px; align-items: center; padding: 0 14px; gap: 12px; z-index: 20; }
#stagebox { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); }
#stagebox b { font-size: 26px; font-weight: 600; color: var(--bulb); font-variant-numeric: tabular-nums; }
#stagebox span { font-size: 14px; color: var(--ink-dim); }
#roundtrack { display: flex; gap: 6px; justify-content: center; align-items: center; }
.pip { width: 26px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); position: relative; }
.pip.pve { background: rgba(95, 211, 141, .3); } .pip.carousel { background: rgba(255, 200, 87, .3); }
.pip.done { opacity: .45; } .pip.now { outline: 2px solid var(--bulb); }
#timerwrap { grid-column: 2; display: grid; gap: 4px; }
#phase { text-align: center; font-family: var(--font-display); font-size: 15px; }
#timerbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
#timerfill { height: 100%; width: 100%; background: var(--bulb); transform-origin: left; }
#timerfill.low { background: var(--neon); }
#hudright { display: flex; justify-content: flex-end; gap: 8px; }
.ghost { background: transparent; border: 1px solid var(--panel-line); border-radius: 6px; padding: 4px 10px; font-size: 13px; }

/* ---------- side panels */
#synergies { position: absolute; left: 12px; top: 64px; width: 210px; bottom: 190px; display: flex; flex-direction: column; gap: 4px; z-index: 5; overflow: hidden; }
.syn { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 3px 8px 3px 3px; border-radius: 6px; background: var(--panel); border: 1px solid transparent; }
.syn.off { opacity: .62; }
.syn img { width: 34px; height: 34px; display: block; }
.syn .nm { font-family: var(--font-display); font-size: 14px; line-height: 1.1; }
.syn .th { font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.syn .th b { color: var(--ink); font-weight: 600; }
.syn .ct { font-family: var(--font-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.syn.style-gold { border-color: rgba(243, 207, 98, .5); } .syn.style-prismatic { border-color: rgba(201, 155, 255, .6); } .syn.style-unique { border-color: rgba(240, 138, 60, .6); }

#players { position: absolute; right: 12px; top: 64px; width: 210px; display: flex; flex-direction: column; gap: 5px; z-index: 5; }
.pl { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; padding: 4px 8px 4px 4px; background: var(--panel); border-radius: 8px; border: 1px solid transparent; text-align: left; }
.pl.me { border-color: var(--bulb); } .pl.view { box-shadow: 0 0 0 2px var(--c3) inset; } .pl.out { opacity: .35; }
.pl .av { width: 36px; height: 36px; border-radius: 6px; background: #2a2d55 center/contain no-repeat; image-rendering: pixelated; }
.pl .nm { font-family: var(--font-display); font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.pl .nm small { color: var(--ink-dim); font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.hpbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 3px; }
.hpbar i { display: block; height: 100%; background: var(--good); }
.pl.low .hpbar i { background: var(--neon); }

/* ---------- board */
#boardwrap { position: absolute; left: 260px; top: -88px; width: 760px; height: 520px; perspective: 1100px; z-index: 2; }
#board { position: absolute; left: 50%; top: 0; width: 640px; height: 560px; margin-left: -320px; transform: rotateX(34deg); transform-origin: 50% 100%; }
.hex { position: absolute; width: 80px; height: 92px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  background: linear-gradient(160deg, #39a59f, var(--tile) 60%, #28817c); }
.hex::after { content: ""; position: absolute; inset: 4px; clip-path: inherit; background: rgba(255,255,255,.04); }
.hex.enemy { background: linear-gradient(160deg, #3a4a7a, #2d3a66 60%, #26315a); }
.hex.drop { background: linear-gradient(160deg, #ffe08a, var(--bulb)); }
#units { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
.unit { position: absolute; transform-origin: 50% 100%; width: 72px; height: 84px; margin: -78px 0 0 -36px; pointer-events: auto; cursor: grab; display: grid; justify-items: center; align-content: end; }
.unit .spr { width: 64px; height: 64px; image-rendering: pixelated; background: center bottom/contain no-repeat; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
.unit .spr.sheet { background-size: 512px auto; background-position: 0 0; }
.unit.enemy .spr { transform: scaleX(-1); }
.unit .stars { position: absolute; top: 0; font-size: 12px; letter-spacing: -1px; color: var(--c5); text-shadow: 0 1px 0 #000; }
.unit .stars.s2 { color: #cfd8e6; } .unit .stars.s1 { color: #c48a5a; }
.unit .bars { position: absolute; top: 12px; width: 52px; display: grid; gap: 1px; }
.unit .bars i { display: block; height: 5px; background: rgba(0,0,0,.6); border-radius: 2px; overflow: hidden; }
.unit .bars i b { display: block; height: 100%; background: var(--good); }
.unit.enemy .bars i b.h { background: var(--neon); }
.unit .bars i.m b { background: #6cc6ff; } .unit .bars i.s { height: 3px; } .unit .bars i.s b { background: #e9edf5; }
.unit .its { position: absolute; bottom: -6px; display: flex; gap: 1px; }
.unit .its img { width: 16px; height: 16px; border-radius: 3px; }
.unit.dead { opacity: 0; transition: opacity .4s; }
.unit.cast .spr { filter: drop-shadow(0 0 8px var(--bulb)) brightness(1.25); }
.unit.dragging { opacity: .35; }
.unit:focus-visible { outline: none; } .unit:focus-visible .spr { outline: 2px solid var(--bulb); }
.float { position: absolute; font-family: var(--font-display); font-weight: 600; font-size: 15px; color: #fff; text-shadow: 0 1px 0 #000, 0 0 4px #000; pointer-events: none; animation: rise .8s ease-out forwards; z-index: 30; }
.float.heal { color: var(--good); } .float.big { font-size: 20px; color: var(--bulb); }
@keyframes rise { from { transform: translateY(0); opacity: 1 } to { transform: translateY(-34px); opacity: 0 } }

#scoutbanner { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 21; background: var(--panel); border: 1px solid var(--c3); border-radius: 18px; padding: 4px 14px; font-size: 13px; }

/* ---------- bench + items */
#bench { position: absolute; left: 290px; top: 548px; width: 700px; height: 64px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; z-index: 6; }
.slot { position: relative; border-radius: 8px; background: rgba(10, 12, 30, .55); border: 1px solid rgba(255,255,255,.06); }
.slot.drop { border-color: var(--bulb); background: rgba(255, 200, 87, .14); }
.slot .unit { left: 50%; top: 100%; margin-top: -80px; }
#itembench { position: absolute; left: 12px; bottom: 112px; width: 230px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 6; min-height: 34px; align-content: flex-end; }
.item { width: 30px; height: 30px; border-radius: 6px; cursor: grab; touch-action: none; }
.item img { width: 100%; height: 100%; display: block; pointer-events: none; }

/* ---------- bottom bar */
#bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 106px; display: grid; grid-template-columns: 230px 1fr 210px; gap: 12px; padding: 0 12px 10px; align-items: end; z-index: 10; }
#levelbox { display: grid; gap: 6px; }
#lvl { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); }
#lvl b { font-size: 22px; } #lvl span { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
#xpbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; } #xpbar i { display: block; height: 100%; background: #6cc6ff; }
.act { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: linear-gradient(180deg, #2a2f63, #1d2150); border: 1px solid var(--panel-line); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
.act:hover:not(:disabled) { border-color: var(--bulb); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act kbd { font-family: var(--font-body); font-size: 11px; color: var(--ink-dim); border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 0 4px; }
.gold { color: var(--bulb); font-variant-numeric: tabular-nums; }
#shop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; height: 96px; }
#shop.sell { outline: 2px dashed var(--neon); outline-offset: 3px; border-radius: 10px; }
.card { position: relative; border-radius: 9px; overflow: hidden; border: 2px solid var(--cc, var(--c1)); background: #171a3a; padding: 0; text-align: left; display: grid; grid-template-rows: 1fr auto; }
.card:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.card:disabled { cursor: not-allowed; }
.card.empty { border-style: dashed; border-color: rgba(255,255,255,.08); background: transparent; }
.card .pic { background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 35%, #171a3a), #171a3a) ; position: relative; overflow: hidden; }
.card .pic img { position: absolute; right: 6px; bottom: -14px; width: 76px; height: 76px; image-rendering: pixelated; }
.card .tr { position: absolute; left: 6px; top: 6px; display: grid; gap: 2px; }
.card .tr span { font-size: 11px; display: flex; align-items: center; gap: 3px; color: var(--ink); text-shadow: 0 1px 0 #000; }
.card .tr img { width: 16px; height: 16px; position: static; }
.card .foot { display: flex; justify-content: space-between; align-items: center; padding: 3px 7px; background: var(--cc); color: #12142a; font-family: var(--font-display); font-size: 13px; line-height: 1.2; }
.card .foot small { font-size: 13px; font-weight: 600; }
.card.own::after { content: ""; position: absolute; inset: 0; box-shadow: 0 0 0 2px var(--bulb) inset; border-radius: 7px; pointer-events: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35 } }
#goldbox { display: grid; gap: 6px; }
#goldnum { font-family: var(--font-display); font-size: 30px; line-height: 1; display: flex; align-items: center; gap: 8px; justify-content: center; }
#goldnum i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b8, var(--bulb) 55%, #c98a10); display: inline-block; }
#income { font-size: 11px; color: var(--ink-dim); text-align: center; font-variant-numeric: tabular-nums; }
#lock.on { border-color: var(--bulb); color: var(--bulb); }

/* ---------- overlays */
.overlay { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(8, 9, 24, .55); }
.overlay.clear { background: transparent; pointer-events: none; }
.overlay.clear > * { pointer-events: auto; }
.modal { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; justify-items: center; }
.modal h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 22px; text-wrap: balance; }
.augs { display: grid; grid-template-columns: repeat(3, 230px); gap: 14px; }
.aug { border-radius: 12px; padding: 16px 14px; display: grid; gap: 10px; justify-items: center; text-align: center; background: #1b1f45; border: 2px solid var(--tc); min-height: 230px; align-content: start; }
.aug:hover { transform: translateY(-4px); }
.aug .ic { width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--tc) 25%, #1b1f45); font-size: 30px; }
.aug .ic img { width: 48px; height: 48px; }
.aug b { font-family: var(--font-display); font-size: 17px; font-weight: 500; }
.aug p { margin: 0; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
.aug small { font-size: 11px; color: var(--tc); }
.row { display: flex; gap: 10px; }
#carousel { position: relative; width: 560px; height: 380px; }
.cu { position: absolute; width: 92px; display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 4px; border-radius: 10px; }
.cu img.s { width: 64px; height: 64px; image-rendering: pixelated; }
.cu .it { width: 22px; height: 22px; }
.cu span { font-size: 11px; font-family: var(--font-display); white-space: nowrap; }
.cu.pick { background: rgba(255, 200, 87, .2); box-shadow: 0 0 0 2px var(--bulb) inset; }
.cu.taken { opacity: .25; }
#banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 35; font-family: var(--font-display); font-size: 40px; font-weight: 600; text-shadow: 0 3px 0 rgba(0,0,0,.5); pointer-events: none; text-align: center; }
#banner small { display: block; font-size: 16px; font-weight: 400; color: var(--ink); }
#banner.win { color: var(--good); } #banner.lose { color: var(--neon); }
#banner.tier-S { color: #c9d5df; } #banner.tier-G { color: #f3cf62; } #banner.tier-P { color: #c99bff; }
#toasts { position: absolute; left: 50%; top: 100px; transform: translateX(-50%); display: grid; gap: 6px; z-index: 36; justify-items: center; pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 5px 14px; font-size: 13px; animation: toast 3.2s forwards; display: flex; gap: 6px; align-items: center; }
.toast img { width: 20px; height: 20px; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px) } 8%, 85% { opacity: 1; transform: none } 100% { opacity: 0 } }
#tip { position: absolute; z-index: 60; width: 270px; background: #0f1130; border: 1px solid var(--panel-line); border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5; pointer-events: none; display: grid; gap: 6px; }
#tip h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
#tip .meta { color: var(--ink-dim); }
#tip .lv { color: var(--ink-dim); } #tip .lv.on { color: var(--ink); } #tip .lv.on::before { content: "▸ "; color: var(--bulb); }
#tip .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; font-variant-numeric: tabular-nums; }
#tip .sk b { color: var(--bulb); font-weight: 500; }

/* title / end screens */
#title .modal { padding: 28px 34px; gap: 16px; max-width: 560px; }
#title h1 { margin: 0; font-family: var(--font-display); font-size: 52px; font-weight: 600; line-height: 1; color: var(--bulb); text-shadow: 0 0 22px rgba(255, 200, 87, .45); letter-spacing: .5px; }
#title p { margin: 0; color: var(--ink-dim); text-align: center; line-height: 1.6; }
.big { font-size: 20px; padding: 10px 34px; border-radius: 10px; background: var(--bulb); color: #1a1430; border: 0; font-weight: 600; }
.big:hover { filter: brightness(1.08); }
.seg { display: inline-flex; border: 1px solid var(--panel-line); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 12px; font-size: 13px; } .seg button[aria-pressed="true"] { background: var(--bulb); color: #1a1430; }
.keys { font-size: 12px; color: var(--ink-dim); }
#rotate { display: none; }
@media (orientation: portrait) and (max-width: 1100px) { #rotate { display: block; position: fixed; left: 16px; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); text-align: center; font-size: 16px; color: var(--bulb); z-index: 100; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- tacticians, loot orbs, carousel arena */
#actors { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
.tac { position: absolute; width: 48px; height: 48px; margin: -44px 0 0 -24px; image-rendering: pixelated; background: center bottom/contain no-repeat; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); transform-origin: 50% 100%; }
.tac.walk { animation: hop .32s steps(2) infinite; }
.tac .tag { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-family: var(--font-display); background: rgba(10,12,30,.8); border-radius: 8px; padding: 0 6px; }
.tac.me .tag { color: var(--bulb); }
.tac .carry { position: absolute; left: 50%; bottom: 34px; width: 40px; height: 40px; margin-left: -20px; image-rendering: pixelated; background: center/contain no-repeat; }
@keyframes hop { 50% { transform: translateY(-3px); } }
.orb { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; animation: bob 1.6s ease-in-out infinite; }
.orb.grey { background: radial-gradient(circle at 35% 30%, #fff, #b9c0d0 45%, #6d7488); box-shadow: 0 0 14px rgba(220,225,240,.7); }
.orb.blue { background: radial-gradient(circle at 35% 30%, #fff, #7cc8ff 45%, #2a62c9); box-shadow: 0 0 16px rgba(90,170,255,.8); }
.orb.gold { background: radial-gradient(circle at 35% 30%, #fff, #ffd76a 45%, #c58a10); box-shadow: 0 0 18px rgba(255,200,87,.9); }
@keyframes bob { 50% { transform: translateY(-5px); } }
#arena { position: absolute; left: 290px; top: 120px; width: 700px; height: 400px; z-index: 3; pointer-events: none;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(47,143,138,.95) 0 62%, rgba(31,103,99,.95) 62% 70%, rgba(255,200,87,.25) 70% 71%, rgba(20,24,54,.85) 71% 100%);
  border-radius: 50%; box-shadow: 0 0 60px rgba(255,200,87,.15) inset; }
#arena::after { content: ""; position: absolute; left: 34%; top: 33%; width: 32%; height: 34%; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,87,.25), transparent 70%); }
#boardwrap.away { opacity: .08; transition: opacity .3s; }
.cunit { position: absolute; width: 64px; height: 64px; margin: -60px 0 0 -32px; pointer-events: auto; cursor: pointer; background: center bottom/contain no-repeat; image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); border: 0; padding: 0; }
.cunit img.it { position: absolute; left: 50%; top: -16px; width: 22px; height: 22px; margin-left: -11px; }
.cunit .nm { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); white-space: nowrap; font-size: 10px; font-family: var(--font-display); text-shadow: 0 1px 0 #000; }
.cunit.target { filter: drop-shadow(0 0 6px var(--bulb)); }
#carouselHint { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 21; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 4px 14px; font-size: 13px; }
.augwrap { display: grid; gap: 8px; }
.augwrap .reroll { font-size: 12px; padding: 4px 8px; justify-content: center; }
.tierline { font-size: 14px; }

#myAugs { display: inline-flex; gap: 3px; margin-left: 4px; }

/* ================= real-art skin (on when the artist's files are embedded) =================
   The rooftop painting is the stage; the UI is a night-market layer on top of it:
   deep indigo glass panels with stepped pixel corners, lantern-gold trim, pixel numerals. */
.realart #stage { background: var(--sky-deep) var(--bg-img) 50% 100% / 124% auto no-repeat; }   /* zoomed so the railing sits above the enemy rows */
.realart #skyline, .realart #lights { display: none; }
.realart #stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(180deg, rgba(10,12,34,.55) 0, rgba(10,12,34,0) 120px), linear-gradient(0deg, rgba(10,12,34,.85) 0, rgba(10,12,34,0) 190px),
              radial-gradient(ellipse 30% 70% at 0 50%, rgba(10,12,34,.6), transparent), radial-gradient(ellipse 30% 70% at 100% 50%, rgba(10,12,34,.6), transparent); }
.realart #stageNum, .realart #goldTxt, .realart .card .foot small, .realart .syn .ct, .realart #boardcount, .realart .place { font-family: var(--font-num); font-weight: 700; letter-spacing: .5px; }
.realart #goldnum { font-size: 34px; text-shadow: 0 2px 0 #000, 0 0 16px rgba(255,200,87,.45); }

.realart .syn, .realart .pl, .realart #dmgpanel, .realart #histpanel, .realart .toast, .realart #tip { background: rgba(14, 16, 44, .82); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

.realart .pl.view { box-shadow: inset 0 0 0 2px var(--cyan); }

.realart .modal { clip-path: var(--notch); border-radius: 0; background: linear-gradient(180deg, rgba(26,30,72,.96), rgba(14,16,44,.96)); border: 0; box-shadow: inset 0 0 0 2px rgba(255,200,87,.35), inset 0 3px 0 rgba(255,122,61,.55); }
.realart .act { clip-path: var(--notch); border-radius: 0; border: 0; background: linear-gradient(180deg, #2c3270, #1b1f50); box-shadow: inset 0 0 0 1px rgba(255,214,140,.3), inset 0 -3px 0 rgba(0,0,0,.35); }
.realart .act:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--bulb), inset 0 -3px 0 rgba(0,0,0,.35); }

/* board: translucent hexes over the painted floor tiles */

.realart .cunit, .realart .tac, .realart .cu img.s, .realart .avopt img, .realart .who img, .realart .lp img, .realart .mu img, .realart .mh .team img, .realart .dmgrow img, .realart .modal.encounter .host { image-rendering: auto; }

/* loot orbs: the artist's glowing glass orbs, 4-frame twinkle */

/* ---------- combat VFX */

@keyframes pop { from { transform: scale(.4); opacity: 1 } to { transform: scale(1.3); opacity: 0 } }

/* tactician: sprite on an inner layer so the name tag never mirrors; JS eases the walk and bob */

@keyframes tap { from { transform: scale(.4); opacity: 1 } to { transform: scale(1.3); opacity: 0 } }

/* ---------- animated sprite sheets (4 columns x 6 rows: idle, walk, attack, cast, hit, die) */
.unit .spr.anim { width: 104px; height: 104px; margin-bottom: -10px; background-size: 400% 600%; background-repeat: no-repeat; background-position: 0% 0%; image-rendering: pixelated; animation: f4 .8s steps(4, jump-none) infinite; }
.realart .unit .spr.anim { width: 104px; height: 104px; image-rendering: pixelated; }
@keyframes f4 { from { background-position-x: 0% } to { background-position-x: 100% } }
@keyframes f2 { from { background-position-x: 0% } to { background-position-x: 33.333% } }
.unit.st-walk .spr.anim { background-position-y: 20%; animation-duration: .5s; }
.unit.st-atk .spr.anim { background-position-y: 40%; animation: f4 var(--st-ms, .36s) steps(4, jump-none) 1 forwards; }
.unit.st-cast .spr.anim { background-position-y: 60%; animation: f4 var(--st-ms, .5s) steps(4, jump-none) 1 forwards; }
.unit.st-hit .spr.anim { background-position-y: 80%; animation: f2 var(--st-ms, .24s) steps(2, jump-none) 1 forwards; }
.unit.st-die .spr.anim { background-position-y: 100%; animation: f2 .4s steps(2, jump-none) 1 forwards; }
.unit.animated.dead { transition: opacity .4s .7s; }
.unit.animated.st-hit .spr.anim, .unit.animated.hit .spr.anim { filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
.slot .unit .spr.anim { animation-duration: 1.1s; }
.fxs { position: absolute; z-index: 29; pointer-events: none; image-rendering: pixelated; background-repeat: no-repeat; background-position: 0 0; }

@media (prefers-reduced-motion: reduce) { .light { animation: none; opacity: var(--lmax); } }
